<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FR Kubik Madani - Multi-Vault Financial System</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
    body { background-color: #f1f5f9; color: #1e293b; }
    .bg-km-blue { background-color: #1e3a8a !important; }
    .text-km-blue { color: #1e3a8a !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .nav-btn-active { background-color: #1e3a8a !important; color: #ffffff !important; font-weight: bold; }
    
    #loadingOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
    }
  </style>
</head>
<body class="min-vh-100 d-flex flex-column pb-5">

  <div id="loadingOverlay" class="d-none">
    <div class="spinner-border text-warning mb-2" role="status" style="width: 3rem; height: 3rem;"></div>
    <span class="text-white fw-bold small">Memproses Data...</span>
  </div>

  <!-- 1. HALAMAN LOGIN -->
  <div id="loginScreenSection" class="login-container p-3">
    <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5 bg-white" style="max-width: 420px; width: 100%;">
      <div class="text-center mb-4">
        <div class="bg-km-blue text-white fw-bold rounded-4 d-inline-flex align-items-center justify-content-center mb-2 shadow" style="width: 54px; height: 54px; font-size: 22px;">KM</div>
        <h4 class="fw-bold text-dark mb-1">FR KUBIK MADANI</h4>
        <small class="text-muted" style="font-size: 11px;">Sistem Keuangan Multi-Vault & Approval Hierarki</small>
      </div>

      <form id="formAppLogin" onsubmit="handleUserLogin(event)">
        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary mb-1">Email / Username *</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
            <input type="email" id="loginEmailInput" required placeholder="nama@kubikmadani.co.id" class="form-control form-control-sm py-2">
          </div>
        </div>

       <div class="mb-4">
  <label class="form-label small fw-bold text-secondary mb-1">Password *</label>
  <div class="input-group input-group-sm">
    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
    <input type="password" id="loginPasswordInput" required placeholder="Masukkan password" class="form-control form-control-sm py-2">
    <button class="btn btn-outline-secondary bg-light border-start-0" type="button" onclick="togglePasswordVisibility()" title="Lihat/Sembunyikan Password">
      <i id="togglePasswordIcon" class="bi bi-eye"></i>
    </button>
  </div>
</div>

        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Masuk ke Sistem
        </button>
      </form>
    </div>
  </div>

  <!-- 2. HALAMAN UTAMA APLIKASI -->
  <div id="mainAppSection" class="d-none flex-column flex-grow-1">
    <header class="bg-km-blue text-white shadow sticky-top py-2 px-3">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <div class="bg-white text-km-blue fw-black rounded-3 px-2 py-1 fs-6 fw-bold">KM</div>
          <div>
            <h1 class="fs-6 fw-bold mb-0 lh-1">FR KUBIK MADANI</h1>
            <small id="envBadgeText" class="text-white-50" style="font-size: 10px;">Multi-Vault & Double-Entry Accounting Engine</small>
          </div>
        </div>
        
        <div class="d-flex align-items-center gap-2">
          <div class="d-none d-sm-block text-end">
            <div id="userNameDisplay" class="fw-bold small lh-1">-</div>
            <small id="userRoleDisplay" class="text-white-50" style="font-size: 10px;">-</small>
          </div>

          <!-- Dropdown Switch Role Simulasi (Hanya muncul jika Role AS) -->
          <select id="roleSimulatorSelector" onchange="switchRoleSimulation(this.value)" class="form-select form-select-sm bg-primary text-warning fw-bold border-0 shadow-sm d-none" style="width: auto;">
            <option value="AS" selected>AS (Super Admin)</option>
            <option value="RPM">RPM (Regional PM)</option>
            <option value="PM">PM (Project Manager)</option>
            <option value="PD">PD (Project Director)</option>
            <option value="HD1">HD1 (Head Divisi 1)</option>
            <option value="HD2">HD2 (Head Divisi 2)</option>
            <option value="HD3">HD3 (Head Divisi 3)</option>
            <option value="M">M (Manager Ops)</option>
            <option value="APC">APC (Admin Petty Cash)</option>
            <option value="D">D (Direktur Utama)</option>
            <option value="FM">FM (Finance Manager)</option>
            <option value="FA">FA (Finance Admin)</option>
          </select>

          <button onclick="handleUserLogout()" class="btn btn-sm btn-outline-light d-flex align-items-center gap-1 py-1 px-2" title="Keluar Akun">
            <i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline">Logout</span>
          </button>
        </div>
      </div>
    </header>

    <div class="container-fluid px-3 mt-3 flex-grow-1">
      
      <div id="roleContextBanner" class="bg-dark text-white p-3 rounded-3 shadow-sm mb-3 d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 border border-secondary">
        <div class="d-flex align-items-center gap-3">
          <div id="roleBannerAvatar" class="bg-warning text-dark fw-bold rounded-3 d-flex align-items-center justify-center fs-5" style="width: 42px; height: 42px;">-</div>
          <div>
            <div class="d-flex align-items-center gap-2">
              <h6 id="roleBannerName" class="mb-0 fw-bold">-</h6>
              <span id="roleBannerPill" class="badge bg-warning text-dark">-</span>
            </div>
            <small id="roleBannerDesc" class="text-white-50" style="font-size: 11px;">Akses Penuh: Manajemen Master User, Setup Kas, dan Monitoring Semua Alur</small>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-12 col-md-4 col-lg-3">
          <div class="card border-0 shadow-sm rounded-3 p-3 sticky-top" style="top: 75px;">
            <div class="d-flex justify-content-between align-items-center pb-2 border-bottom mb-2">
              <span class="text-muted fw-bold" style="font-size: 11px;">NAVIGASI UTAMA</span>
              <span id="sidebarRolePill" class="badge bg-primary">-</span>
            </div>
            <div id="desktopNavLinks" class="d-flex flex-column gap-1"></div>
          </div>
        </div>

        <div class="col-12 col-md-8 col-lg-9">
          <div class="card border-0 shadow-sm rounded-3 p-3 p-sm-4 min-vh-50">
            <div class="d-flex justify-content-between align-items-center pb-3 border-bottom mb-3">
              <div>
                <h5 id="pageMainTitle" class="fw-bold text-dark mb-0 fs-6 fs-sm-5">Dashboard</h5>
                <small id="pageMainSubtitle" class="text-muted">-</small>
              </div>
              <button onclick="refreshCurrentPage()" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1" title="Muat Ulang Data">
                <i class="bi bi-arrow-clockwise"></i> <span class="d-none d-sm-inline">Refresh</span>
              </button>
            </div>

            <div id="appDynamicContent"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLnj8bBFTi7T5RUY911t5yBUdEJz4D93ODmF4YPnU8bOaGQwIJyw5wHa1_Ub_jcAit/exec";

    var REGIONAL_HIERARCHY = {
      "Jabodetabek": ["Seluruh Jabodetabek", "Jakarta Pusat", "Jakarta Barat", "Jakarta Selatan", "Jakarta Timur", "Jakarta Utara", "Bogor", "Depok", "Tangerang", "Bekasi"],
      "Kalimantan": ["Seluruh Kalimantan", "Kalbar", "Kalteng", "Kalsel", "Kaltara", "Kaltim"],
      "Sulawesi": ["Seluruh Sulawesi", "Sulteng", "Sultra", "Sulut", "Sulsel", "Sulbar", "Gorontalo"],
      "Jawa": ["Seluruh Jawa", "EJ (Jatim)", "WJ (Jabar)", "CJ (Jateng)", "DIY", "Banten"],
      "Sumatera": ["Seluruh Sumatera", "Sumbagut", "Sumbagteng", "Sumbagsel", "Sumbar", "Aceh", "Lampung"],
      "Pusat / Kantor Pusat": ["Pusat (Head Quarter)"]
    };

    var currentUser = null;
    var currentPage = 'dashboard';
    var isRoleSimulationActive = false;

    var db = {
      saldo: { saldoBesar: 250000000, saldoKecilA: 15000000, saldoKecilB: 12000000, saldoKecilC: 8000000, saldoKecilD: 5000000 },
      poList: [],
      sowList: [],
      costCatalog: [],
      costCategories: ["Transport & BBM Lapangan", "Akomodasi & Meal (OHS)", "Material & Consumables", "Operasional Kantor / ATK", "Kas Advance / Petty Cash"],
      list: [],
      invoicesList: [],
      usersList: [],
      utangPiutangList: [],
      kasbonList: []
    };

    function startLoading() {
      var el = document.getElementById("loadingOverlay");
      if (el) el.classList.remove("d-none");
    }
    function endLoading() {
      var el = document.getElementById("loadingOverlay");
      if (el) el.classList.add("d-none");
    }

    function handleUserLogin(e) {
      e.preventDefault();
      startLoading();

      var emailVal = document.getElementById("loginEmailInput").value.trim();
      var passVal = document.getElementById("loginPasswordInput").value.trim();

      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            endLoading();
            if (res && res.success) {
              currentUser = res.user;
              onLoginSuccess();
            } else {
              Swal.fire('Login Gagal', res ? res.message : 'Kredensial tidak valid.', 'error');
            }
          })
          .withFailureHandler(function(err) {
            endLoading();
            Swal.fire('Error Server', err.message, 'error');
          })
          .authenticateUser(emailVal, passVal);
      } else {
        endLoading();
        currentUser = {
          userId: "USR-01",
          nama: emailVal.indexOf("rpm") > -1 ? "Budi Santoso" : "Super Admin",
          email: emailVal,
          role: emailVal.indexOf("rpm") > -1 ? "RPM" : "AS",
          regional: "Jabodetabek",
          subRegional: "Pusat",
          project: "ZTE",
          divisi: "Operations"
        };
        onLoginSuccess();
      }
    }

    function onLoginSuccess() {
      document.getElementById("loginScreenSection").classList.add("d-none");
      document.getElementById("mainAppSection").classList.remove("d-none");
      document.getElementById("mainAppSection").classList.add("d-flex");

      updateUserBadge();

      if (currentUser.role === 'RPM') {
        currentPage = 'rf_rpm';
      } else {
        currentPage = 'dashboard';
      }

      renderNavMenu();
      loadPage(currentPage);
      loadAllData();
      showToast('success', 'Selamat datang, ' + currentUser.nama);
    }

    function handleUserLogout() {
      Swal.fire({
        title: 'Konfirmasi Logout',
        text: 'Apakah Anda yakin ingin keluar dari sistem?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Ya, Logout',
        cancelButtonText: 'Batal'
      }).then(function(res) {
        if (res.isConfirmed) {
          currentUser = null;
          document.getElementById("formAppLogin").reset();
          document.getElementById("mainAppSection").classList.add("d-none");
          document.getElementById("mainAppSection").classList.remove("d-flex");
          document.getElementById("loginScreenSection").classList.remove("d-none");
        }
      });
    }

    function switchRoleSimulation(selectedRole) {
      if (currentUser.role !== 'AS' && !isRoleSimulationActive) return;
      isRoleSimulationActive = true;
      currentUser.role = selectedRole;

      if (selectedRole === 'RPM') {
        currentUser.email = "budi.rpm@kubikmadani.co.id"; currentUser.nama = "Budi Santoso"; currentUser.regional = "Jabodetabek"; currentUser.project = "ZTE";
        currentPage = 'rf_rpm';
      } else if (selectedRole === 'PM') {
        currentUser.email = "pm.telco@kubikmadani.co.id"; currentUser.nama = "Hendra Pratama"; currentUser.regional = "Pusat";
        currentPage = 'approval_box';
      } else if (['PD', 'M', 'D', 'FM', 'HD1', 'HD2', 'HD3'].includes(selectedRole)) {
        currentUser.email = selectedRole.toLowerCase() + "@kubikmadani.co.id"; currentUser.nama = "Verifikator " + selectedRole;
        currentPage = 'approval_box';
      } else if (selectedRole === 'FA') {
        currentUser.email = "finance.adm@kubikmadani.co.id"; currentUser.nama = "Rina Finance (FA)";
        currentPage = 'approval_box';
      } else {
        currentUser.email = "admin.super@kubikmadani.co.id"; currentUser.nama = "Super Admin";
        currentPage = 'dashboard';
      }

      updateUserBadge();
      renderNavMenu();
      loadPage(currentPage);
      showToast('info', 'Beralih Simulasi Peran: ' + selectedRole);
    }

    function updateUserBadge() {
      if (!currentUser) return;
      var nameEl = document.getElementById("userNameDisplay");
      var roleEl = document.getElementById("userRoleDisplay");
      var simEl = document.getElementById("roleSimulatorSelector");
      var pillEl = document.getElementById("sidebarRolePill");
      var bName = document.getElementById("roleBannerName");
      var bPill = document.getElementById("roleBannerPill");
      var bAvatar = document.getElementById("roleBannerAvatar");

      if (nameEl) nameEl.innerText = currentUser.nama;
      if (roleEl) roleEl.innerText = currentUser.role + " - " + (currentUser.regional || currentUser.divisi || "Pusat");
      if (pillEl) pillEl.innerText = currentUser.role;
      if (bName) bName.innerText = currentUser.nama;
      if (bPill) bPill.innerText = currentUser.role + " (" + (currentUser.project || currentUser.divisi || "Pusat") + ")";
      if (bAvatar) bAvatar.innerText = currentUser.role.substring(0, 3);

      if (simEl) {
        simEl.value = currentUser.role;
        if (currentUser.role === 'AS') {
          simEl.classList.remove('d-none');
        } else {
          simEl.classList.add('d-none');
        }
      }
    }

    function renderNavMenu() {
      if (!currentUser) return;
      var role = currentUser.role;
      var userEmail = String(currentUser.email || '').trim().toLowerCase();
      var userName = String(currentUser.nama || '').trim().toLowerCase();
      var desktopNav = document.getElementById("desktopNavLinks");
      if (!desktopNav) return;

      var listArr = Array.isArray(db.list) ? db.list : [];

      var hasSubmittedRF = false;
      for (var u = 0; u < listArr.length; u++) {
        var row = listArr[u];
        if (!row) continue;
        var rEmail = String(row.email || '').trim().toLowerCase();
        var rPic = String(row.picPenerima || '').trim().toLowerCase();
        if ((rEmail && rEmail === userEmail) || (rPic && rPic === userName)) {
          hasSubmittedRF = true;
          break;
        }
      }
      if (role === 'AS') hasSubmittedRF = true;

      var approverRoles = ['PM', 'PD', 'HD1', 'HD2', 'HD3', 'M', 'APC', 'D', 'FM', 'FA', 'AS'];
      var canViewStatusRequest = hasSubmittedRF || approverRoles.indexOf(role) > -1;

      var menus = [];

      if (role !== 'RPM') {
        menus.push({ id: 'dashboard', label: 'Dashboard & LK', icon: 'bi-speedometer2' });
      }

      if (['RPM', 'APC', 'AS'].includes(role)) menus.push({ id: 'rf_rpm', label: 'Buat RF (RPM)', icon: 'bi-file-earmark-plus' });
      if (['PM', 'HD1', 'HD2', 'HD3', 'M', 'APC', 'AS'].includes(role)) menus.push({ id: 'rf_general', label: 'Buat RF Operasional', icon: 'bi-receipt' });
      if (['APC', 'AS'].includes(role)) menus.push({ id: 'rf2_apc', label: 'Isi Kas Kecil (RF2)', icon: 'bi-safe' });
      if (['FA', 'AS'].includes(role)) menus.push({ id: 'invoice_mgmt', label: 'Invoice & Jadwal Kas', icon: 'bi-file-earmark-text' });
      if (['FA', 'FM', 'AS'].includes(role)) menus.push({ id: 'utang_piutang', label: 'Utang & Piutang', icon: 'bi-cash-coin' });
      if (['FA', 'FM', 'APC', 'AS'].includes(role)) menus.push({ id: 'kasbon_karyawan', label: 'Kasbon Karyawan', icon: 'bi-person-lines-fill' });

      if (canViewStatusRequest) {
        menus.push({ id: 'status_rf', label: 'Status Request', icon: 'bi-clock-history' });
      }

      if (hasSubmittedRF) {
        menus.push({ id: 'rspf_form', label: 'Form Realisasi (RSPF)', icon: 'bi-card-checklist' });
      }

      if (role !== 'RPM') {
        var pendingCount = 0;
        for (var i = 0; i < listArr.length; i++) {
          var itm = listArr[i];
          if (!itm) continue;
          var st = String(itm.status || '').trim();
          if (role === 'PM' && st === 'Pending PM') pendingCount++;
          else if (role === 'M' && st === 'Pending M') pendingCount++;
          else if (role === 'PD' && st === 'Pending PD') pendingCount++;
          else if (role === 'D' && st === 'Pending D') pendingCount++;
          else if (role === 'FM' && st === 'Pending FM') pendingCount++;
          else if (role === 'FA' && st === 'Pending FA') pendingCount++;
          else if (role === 'AS' && st.indexOf('Pending') > -1) pendingCount++;
        }

        var labelText = 'Cek Approval';
        if (pendingCount > 0) {
          labelText += ' (' + pendingCount + ')';
        }

        menus.push({ 
          id: 'approval_box', 
          label: labelText, 
          icon: 'bi-check-circle', 
          badge: (pendingCount > 0)
        });
      }

      if (role === 'AS') {
        menus.push({ id: 'master_user', label: 'Manajemen User', icon: 'bi-people' });
        menus.push({ id: 'master_data', label: 'Master Data & Saldo', icon: 'bi-database' });
      }

      var html = '';
      for (var j = 0; j < menus.length; j++) {
        var m = menus[j];
        var btnClass = (currentPage === m.id) ? 'nav-btn-active' : 'btn-light';
        var badgeHtml = m.badge ? '<span class="badge rounded-pill bg-success">!</span>' : '';
        html += '<button onclick="loadPage(\'' + m.id + '\')" class="btn btn-sm text-start w-100 d-flex justify-content-between align-items-center py-2 ' + btnClass + '">';
        html += '<div><i class="bi ' + m.icon + ' me-2"></i><span>' + m.label + '</span></div>';
        html += badgeHtml;
        html += '</button>';
      }
      desktopNav.innerHTML = html;
    }

    function loadPage(pageId) {
      if (!currentUser) return;
      currentPage = pageId;
      renderNavMenu();
      var content = document.getElementById("appDynamicContent");
      var title = document.getElementById("pageMainTitle");
      var subtitle = document.getElementById("pageMainSubtitle");

      if (!content) return;

      switch(pageId) {
        case 'dashboard':
          if (title) title.innerText = "Dashboard & Laporan Keuangan (LK)";
          if (subtitle) subtitle.innerText = "Monitoring real-time saldo multi-kas dan Jurnal Mutasi";
          renderDashboardPage(content);
          break;
        case 'rf_rpm':
          if (title) title.innerText = "Request Form (RF) - Lapangan RPM";
          if (subtitle) subtitle.innerText = "Pengajuan dana operasional Site ID beserta rincian teknis";
          renderRFRPMPage(content);
          break;
        case 'rf_general':
          if (title) title.innerText = "Request Form (RF) - Operasional";
          if (subtitle) subtitle.innerText = "Pengajuan dana OPEX / CAPEX operasional divisi";
          renderRFGeneralPage(content);
          break;
        case 'rf2_apc':
          if (title) title.innerText = "Permohonan Isi Kas Kecil (RF2)";
          if (subtitle) subtitle.innerText = "Pengajuan Top-Up Kas Kecil dari Kas Besar";
          renderRF2APCPage(content);
          break;
        case 'invoice_mgmt':
          if (title) title.innerText = "Manajemen Invoice & Jadwal Kas Masuk (FA)";
          if (subtitle) subtitle.innerText = "Input tagihan invoice klien & pencairan termin ke Kas Besar";
          renderInvoiceManagementPage(content);
          break;
        case 'kasbon_karyawan':
          if (title) title.innerText = "Manajemen Kasbon & Pinjaman Karyawan";
          if (subtitle) subtitle.innerText = "Pencairan kasbon multi-kas kecil & pemotongan cicilan gaji (1 s/d 12 bulan)";
          renderKasbonPage(content);
          break;
        case 'utang_piutang':
          if (title) title.innerText = "Buku Utang & Piutang Perusahaan";
          if (subtitle) subtitle.innerText = (currentUser.role === 'FM') ? "Mode Monitoring (View Only)" : "Pengelolaan & Pelunasan Utang Vendor / Piutang Mitra";
          renderUtangPiutangPage(content);
          break;
        case 'status_rf':
          if (title) title.innerText = "Status Pelacakan Request (SR)";
          if (subtitle) subtitle.innerText = "Riwayat pengajuan dan status persetujuan aktif";
          renderStatusRequestPage(content);
          break;
        case 'rspf_form':
          if (title) title.innerText = "Responsible Form (RSPF)";
          if (subtitle) subtitle.innerText = "Pelaporan realisasi nota belanja riil & bukti transaksi";
          renderRSPFPage(content);
          break;
        case 'approval_box':
          if (title) title.innerText = "Panel Verifikasi & Approval";
          if (subtitle) subtitle.innerText = "Antrean persetujuan & eksekusi pencairan role: " + currentUser.role;
          renderApprovalPage(content);
          break;
        case 'master_user':
          if (title) title.innerText = "Manajemen Pengguna & PIC Penerima (AS)";
          if (subtitle) subtitle.innerText = "Pendaftaran akun karyawan dan hierarki";
          renderUserManagementPage(content);
          break;
        case 'master_data':
          if (title) title.innerText = "Master Data & Saldo Kas (AS)";
          if (subtitle) subtitle.innerText = "Kelola Master SOW, PO, dan Setup Saldo Kas";
          renderMasterDataPage(content);
          break;
        default:
          renderDashboardPage(content);
      }
    }

    function refreshCurrentPage() {
      loadAllData();
      showToast('success', 'Data diperbarui');
    }

    function parseCustomDate(dateStr) {
      if (!dateStr || dateStr === '-') return null;
      if (dateStr instanceof Date) return dateStr;
      var parts = String(dateStr).trim().split('/');

        return new Date(y, m, d);

        var iy = parseInt(isoParts[0], 10);
        var im = parseInt(isoParts[1], 10) - 1;
        var id = parseInt(isoParts[2], 10);
        return new Date(iy, im, id);

    function onDashboardSiteChanged(siteId) {
      var poList = db.poList || [];
      var poItem = null;
      for (var i = 0; i < poList.length; i++) {
        if (poList[i].siteId === siteId) {
          poItem = poList[i];
          break;
        }
      }

      var lineBox = document.getElementById("dashPOLineBox");
      var paguEl = document.getElementById("dashPaguDisplay");
      var costEl = document.getElementById("dashCostDisplay");
      var sisaEl = document.getElementById("dashSisaDisplay");
      var statusBadge = document.getElementById("dashStatusBadge");

      if (!poItem) {
        if (lineBox) lineBox.innerHTML = '<span>-</span><span class="badge bg-secondary">Pagu: Rp 0</span>';
        if (paguEl) paguEl.innerText = "Rp 0";
        if (costEl) costEl.innerText = "Rp 0";
        if (sisaEl) sisaEl.innerText = "Rp 0";
        if (statusBadge) { statusBadge.innerText = "-"; statusBadge.className = "badge bg-secondary"; }
        return;
      }

      var pagu = Number(poItem.budget) || 0;
      var list = db.list || [];
      var totalCost = 0;
      for (var j = 0; j < list.length; j++) {
        if (list[j] && list[j].siteIds === siteId) {
          totalCost += Number(list[j].credit || list[j].totalNilai || 0);
        }
      }

      var sisa = pagu - totalCost;
      var pct = (pagu > 0) ? ((totalCost / pagu) * 100) : 0;

      if (lineBox) {
        lineBox.innerHTML = '<span>' + poItem.poNumber + ' &bull; ' + poItem.poLine + ' (' + poItem.project + ')</span>' +
          '<span class="badge bg-warning text-dark">Pagu: Rp ' + pagu.toLocaleString('id-ID') + '</span>';
      }
      if (paguEl) paguEl.innerText = "Rp " + pagu.toLocaleString('id-ID');
      if (costEl) costEl.innerText = "Rp " + totalCost.toLocaleString('id-ID');
      if (sisaEl) {
        sisaEl.innerText = "Rp " + sisa.toLocaleString('id-ID');
        sisaEl.className = "fs-6 fw-extrabold " + (sisa < 0 ? "text-danger" : "text-success");
      }

      if (statusBadge) {
        if (pct >= 100) {
          statusBadge.innerText = pct.toFixed(1) + "% (OVER BUDGET)";
          statusBadge.className = "badge bg-danger text-white mt-1 px-2.5 py-1";
        } else if (pct >= 85) {
          statusBadge.innerText = pct.toFixed(1) + "% (Mendekati Limit)";
          statusBadge.className = "badge bg-warning text-dark mt-1 px-2.5 py-1";
        } else {
          statusBadge.innerText = pct.toFixed(1) + "% (Aman / Normal)";
          statusBadge.className = "badge bg-success text-white mt-1 px-2.5 py-1";
        }
      }
    }

    function executeFilteredExport(filter) {
      var listData = Array.isArray(db.list) ? db.list : [];
      var poList = Array.isArray(db.poList) ? db.poList : [];

      var customStart = filter.startDate ? new Date(filter.startDate + "T00:00:00") : null;
      var customEnd = filter.endDate ? new Date(filter.endDate + "T23:59:59") : null;
      var targetMonth = filter.month;
      var targetYear = filter.year ? parseInt(filter.year, 10) : null;
      var targetSite = String(filter.siteId || 'ALL').trim().toUpperCase();
      var targetSow2 = String(filter.sow2 || 'ALL').trim().toUpperCase();

      var exportRows = [];

      for (var i = 0; i < listData.length; i++) {
        var tx = listData[i];
        if (!tx) continue;

        var txDate = parseCustomDate(tx.tglTransfer) || parseCustomDate(tx.tgl);
        var rowSite = String(tx.siteIds || '').trim().toUpperCase();
        var rowSow2 = String(tx.sow2 || '').trim().toUpperCase();

        if (customStart && customEnd) {
          if (!txDate || txDate < customStart || txDate > customEnd) continue;
        } else if (txDate) {
          if (targetMonth !== "ALL" && (txDate.getMonth() + 1) !== parseInt(targetMonth, 10)) continue;
          if (targetYear && txDate.getFullYear() !== targetYear) continue;
        }

        if (targetSite !== "ALL" && rowSite !== targetSite) continue;
        if (targetSow2 !== "ALL" && rowSow2 !== targetSow2) continue;

        var poItem = null;
        for (var p = 0; p < poList.length; p++) {
          var pSite = String(poList[p].siteId || '').trim().toUpperCase();
          if (pSite === rowSite) {
            poItem = poList[p];
            break;
          }
        }

        var paguPO = poItem ? Number(poItem.budget || 0) : 0;
        var creditVal = Number(tx.credit || tx.totalNilai || 0);
        var pctPoSpent = (paguPO > 0) ? ((creditVal / paguPO) * 100).toFixed(2) + "%" : "-";

        exportRows.push({
          "No RF": tx.noRF || "-",
          "Tgl Request": tx.tgl || "-",
          "Tgl Transfer": tx.tglTransfer || "-",
          "Site ID / Kegiatan": tx.siteIds || "-",
          "SOW 2": tx.sow2 || "-",
          "SOW 4 / Rincian": tx.sow4 || "-",
          "Item Code": tx.itemCode || "-",
          "Kategori": tx.kategori || "OPEX",
          "Cost Category": tx.costCategory || "-",
          "Cost Detail": tx.costDetail || "-",
          "PIC Penerima": tx.picPenerima || "-",
          "Debit (Rp)": Number(tx.debit || 0),
          "Credit (Rp)": creditVal,
          "Sumber Kas": tx.sumberKas || "-",
          "Biaya Transfer (Rp)": Number(tx.biayaTrf || 0),
          "Status": tx.status || "-",
          "Pagu Budget PO (Rp)": paguPO > 0 ? paguPO : "-",
          "% Terhadap Budget PO": pctPoSpent,
          "Saldo Kas Berjalan (Rp)": Number(tx.saldoKas || 0)
        });
      }

      if (exportRows.length === 0) {
        Swal.fire('Info', 'Tidak ditemukan data transaksi yang sesuai filter.', 'warning');
        return;
      }

      var ws = XLSX.utils.json_to_sheet(exportRows);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Jurnal_LK_Filtered");

      var fileName = "LK_Export_" + (targetSite !== "ALL" ? targetSite + "_" : "") + (new Date().getTime()) + ".xlsx";
      XLSX.writeFile(wb, fileName);

      showToast('success', exportRows.length + ' data diekspor ke Excel!');
    }

    function onSiteRPMChanged(siteId) {
      var textEl = document.getElementById("rfVisitTimesText");
      if (!textEl || !siteId) return;

      var list = db.list || [];
      var visitCount = 0;
      for (var i = 0; i < list.length; i++) {
        if (list[i] && list[i].siteIds === siteId) {
          visitCount++;
        }
      }

      var nextVisit = visitCount + 1;
      if (visitCount === 0) {
        textEl.innerHTML = '<span class="badge bg-success text-white">Kunjungan Pertama (Visit 1)</span> &bull; <span class="text-muted">Belum pernah dikunjungi sebelumnya</span>';
      } else {
        textEl.innerHTML = '<span class="badge bg-warning text-dark">Kunjungan ke-' + nextVisit + ' (Visit ' + nextVisit + ')</span> &bull; <span class="text-secondary">Sudah ' + visitCount + 'x diajukan sebelumnya</span>';

    function processApproval(noRF, action) {
      var isDisbursement = (currentUser.role === 'FA' || currentUser.role === 'AS');
      var fileInp = document.getElementById("apvTransferFile_" + noRF);
      var vaultSel = document.getElementById("apvVaultSelector_" + noRF) ? document.getElementById("apvVaultSelector_" + noRF).value : 'Kas Kecil A';
      var feeVal = document.getElementById("apvTransferFee_" + noRF) ? document.getElementById("apvTransferFee_" + noRF).value : 0;

      if (isDisbursement && action === 'Transferred' && fileInp && (!fileInp.files || fileInp.files.length === 0)) {
        Swal.fire('Perhatian', 'Harap upload bukti transfer sebelum menyelesaikan transfer kas.', 'warning');
        return;
      }

      if (action === 'Reject' || action === 'Revisi') {
        Swal.fire({
          title: (action === 'Reject' ? 'Tolak Pengajuan ' : 'Minta Revisi ') + noRF,
          text: 'Tuliskan catatan alasan / hal yang harus diperbaiki pemohon:',
          input: 'textarea',
          inputPlaceholder: 'Contoh: Lampirkan rincian SPK terbaru / Kurangi pagu biaya...',
          showCancelButton: true,
          confirmButtonText: 'Kirim ' + action,
          cancelButtonText: 'Batal',
          inputValidator: function(value) {
            if (!value || !value.trim()) {
              return 'Catatan tidak boleh kosong!';
            }
          }
        }).then(function(result) {
          if (result.isConfirmed && result.value) {
            executeApprovalCall(noRF, action, result.value.trim(), null, null, null, feeVal, vaultSel);
          }
        });
        return;
      }

      Swal.fire({
        title: 'Konfirmasi ' + (action === 'Transferred' ? 'Transfer Kas' : 'Approval') + '?',
        text: 'Memproses persetujuan dokumen ' + noRF,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Ya, Proses'
      }).then(function(res) {
        if (res.isConfirmed) {
          if (fileInp && fileInp.files && fileInp.files[0]) {
            var file = fileInp.files[0];
            var reader = new FileReader();
            reader.onload = function(e) {
              var base64 = e.target.result.split(',')[1];
              executeApprovalCall(noRF, action, '', base64, file.name, file.type, feeVal, vaultSel);
            };
            reader.readAsDataURL(file);
          } else {
            executeApprovalCall(noRF, action, '', null, null, null, feeVal, vaultSel);
          }
        }
      });
    }

    function executeApprovalCall(noRF, action, note, fileBase64, fileName, fileMime, feeVal, vaultSel) {
      startLoading();
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(msg) {
            endLoading();
            Swal.fire('Selesai', msg, 'success');
            loadAllData();
            loadPage('approval_box');
          })
          .withFailureHandler(function(err) {
            endLoading();
            Swal.fire('Gagal', err.message, 'error');
          })
          .submitApprovalAction(noRF, currentUser.role, action, note, fileBase64, fileName, fileMime, feeVal, vaultSel, 'Kas Kecil A');
      } else {
        var target = null;
        for (var i = 0; i < db.list.length; i++) {
          if (db.list[i].noRF === noRF) { target = db.list[i]; break; }
        }
        if (target) {
          if (action.indexOf('Reject') > -1) target.status = 'Rejected by ' + currentUser.role;
          else if (action.indexOf('Revisi') > -1) target.status = 'Revisi by ' + currentUser.role;
          else if (target.status === 'Pending PM') target.status = 'Pending PD';
          else if (target.status === 'Pending M') target.status = 'Pending D';
          else if (target.status === 'Pending PD' || target.status === 'Pending D') target.status = 'Pending FM';
          else if (target.status === 'Pending FM') target.status = 'Pending FA';
          else if (target.status === 'Pending FA') target.status = 'Transferred';
        }
        endLoading();
        Swal.fire('Selesai', 'Tindakan ' + action + ' berhasil diproses.', 'success');
        renderNavMenu();
        loadPage('approval_box');
      }
    }

    // --- VIEW: STATUS REQUEST ---
    function renderStatusRequestPage(container) {
      if (!container) return;
      var isRPM = (currentUser.role === 'RPM');
      var listArr = db.list || [];
      var poList = db.poList || [];
      var html = '<div class="d-flex flex-column gap-2">';

      var siteVisitMap = {};
      for (var j = listArr.length - 1; j >= 0; j--) {
        var sId = String(listArr[j].siteIds || '').trim().toUpperCase();
        if (sId && sId !== '-') {
          if (!siteVisitMap[sId]) siteVisitMap[sId] = 0;
          siteVisitMap[sId]++;
          listArr[j]._calculatedVisit = siteVisitMap[sId];
        }
      }

      for (var i = 0; i < listArr.length; i++) {
        var item = listArr[i];
        if (!item) continue;
        
        var isRejected = String(item.status || '').indexOf('Rejected') > -1;
        var isNeedRev = String(item.status || '').indexOf('Revisi') > -1;
        var isTransferred = item.status === 'Transferred';

        var stClass = isTransferred ? 'bg-success' : (isRejected ? 'bg-danger text-white' : (isNeedRev ? 'bg-warning text-dark' : 'bg-warning text-dark'));
        
        var visitBadge = '';
        if (isRPM && item.siteIds && item.siteIds !== '-' && item.siteIds !== 'PETTY-CASH') {
          var vCount = item._calculatedVisit || 1;
          visitBadge = '<span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle ms-2">' +
            '<i class="bi bi-geo-alt me-1"></i> Visit ' + vCount +
          '</span>';
        }

        var btnRevisiHtml = '';
        if (isNeedRev && (currentUser.role === 'RPM' || currentUser.role === 'AS')) {
          btnRevisiHtml = '<button onclick="openRevisionForm(\'' + item.noRF + '\')" class="btn btn-xs btn-warning text-dark fw-bold px-2 py-1 mt-1" style="font-size: 10.5px;">' +
            '<i class="bi bi-pencil-square me-1"></i> Kirim Ulang Revisi' +
          '</button>';
        }

        var poBudgetBox = '';
        var targetSite = String(item.siteIds || '').trim().toUpperCase();
        var targetSow2 = String(item.sow2 || '').trim().toUpperCase();
        var targetCode = String(item.itemCode || '').trim().toUpperCase();

        if (targetSite !== '' && targetSite !== '-' && targetSite !== 'PETTY-CASH') {
          var matchedTotalCredit = 0;
          for (var v = 0; v < listArr.length; v++) {
            var row = listArr[v];
            if (!row) continue;
            var rowSite = String(row.siteIds || '').trim().toUpperCase();
            if (rowSite === targetSite) {
              var rowSow2 = String(row.sow2 || '').trim().toUpperCase();
              var rowCode = String(row.itemCode || '').trim().toUpperCase();

              var isSow2Match = (targetSow2 !== '' && targetSow2 !== '-' && rowSow2 === targetSow2);
              var isCodeMatch = (targetCode !== '' && targetCode !== '-' && rowCode === targetCode);

              if (isSow2Match || isCodeMatch || (targetSow2 === '-' && targetCode === '-')) {
                matchedTotalCredit += Number(row.credit || row.totalNilai || 0);
              }
            }
          }

          if (matchedTotalCredit === 0) {
            matchedTotalCredit = Number(item.credit || item.totalNilai || 0);
          }

          var poItem = null;
          for (var p = 0; p < poList.length; p++) {
            var pSite = String(poList[p].siteId || '').trim().toUpperCase();
            if (pSite === targetSite || targetSite.indexOf(pSite) > -1 || pSite.indexOf(targetSite) > -1) {
              poItem = poList[p];
              break;
            }
          }

          var paguPO = poItem ? Number(poItem.budget || 0) : 0;
          var badgeHtml = '';

          if (paguPO > 0) {
            var pctSpent = (matchedTotalCredit / paguPO) * 100;
            var budgetBadgeClass = 'bg-success';
            var budgetStatusText = 'Aman';
            if (pctSpent >= 100) {
              budgetBadgeClass = 'bg-danger text-white';
              budgetStatusText = 'OVER BUDGET';
            } else if (pctSpent >= 85) {
              budgetBadgeClass = 'bg-warning text-dark';
              budgetStatusText = 'Mendekati Limit';
            }
            badgeHtml = '<span class="badge ' + budgetBadgeClass + ' fw-bold mt-1 mt-sm-0">' + 
              pctSpent.toFixed(1) + '% dari PO (Pagu: Rp ' + paguPO.toLocaleString('id-ID') + ' &bull; ' + budgetStatusText + ')' +
            '</span>';
          } else {
            badgeHtml = '<span class="badge bg-light text-muted border mt-1 mt-sm-0">Pagu PO: Belum Diset</span>';
          }

          poBudgetBox = '<div class="mt-2 pt-2 border-top d-flex flex-wrap align-items-center justify-content-between text-muted" style="font-size: 11px;">' +
            '<span><i class="bi bi-pie-chart-fill me-1 text-primary"></i> Akumulasi SOW/Code Sama: <b class="text-dark">Rp ' + matchedTotalCredit.toLocaleString('id-ID') + '</b></span>' +
            badgeHtml +
          '</div>';
        }

        html += '<div class="card p-3 border rounded-3 bg-white shadow-sm mb-2">' +
          '<div class="d-flex flex-row justify-content-between align-items-start">' +
            '<div>' +
              '<div class="d-flex align-items-center mb-1">' +
                '<span class="fw-bold text-primary small">' + item.noRF + '</span>' +
                '<span class="text-muted small mx-1">&bull;</span>' +
                '<small class="text-muted">' + item.tgl + '</small>' +
                visitBadge +
              '</div>' +
              '<div class="small text-dark fw-bold">' + (item.siteIds !== '-' ? '<span class="badge bg-light text-dark border me-1">' + item.siteIds + '</span>' : '') + item.costCategory + ' &ndash; ' + item.costDetail + '</div>' +
              '<div class="small text-muted mt-0.5">Total Pengajuan: <span class="fw-bold text-dark">Rp ' + Number(item.totalNilai || item.credit || 0).toLocaleString('id-ID') + '</span></div>' +
            '</div>' +
            '<div class="text-end">' +
              '<span class="badge ' + stClass + '">' + item.status + '</span>' +
              '<div>' + btnRevisiHtml + '</div>' +
            '</div>' +
          '</div>' +
          poBudgetBox +
        '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    function onRSPFSelected(noRF) {
      var item = null;
      for (var i = 0; i < db.list.length; i++) {
        if (db.list[i] && db.list[i].noRF === noRF) { item = db.list[i]; break; }
      }
      var nominal = item ? (item.credit || item.totalNilai || 0) : 0;
      document.getElementById("rspfNominalAwal").value = "Rp " + Number(nominal).toLocaleString('id-ID');
      document.getElementById("rspfNominalAwal").setAttribute("data-raw", nominal);
      calcRSPFSelisih();

      var rpmBox = document.getElementById("rspfRPMDetailBox");
      if (rpmBox && item) {
        rpmBox.classList.remove("d-none");
        document.getElementById("rspfViewSOW2").value = item.sow2 || "-";
        document.getElementById("rspfViewSOW4").value = item.sow4 || "-";
        document.getElementById("rspfViewItemCode").value = item.itemCode || "-";
        document.getElementById("rspfViewCostCategory").value = item.costCategory || "-";
        document.getElementById("rspfViewCostDetail").value = item.costDetail || "-";
      }
    }

    function calcRSPFSelisih() {
      var awalEl = document.getElementById("rspfNominalAwal");
      var riilEl = document.getElementById("rspfNominalRiil");
      var selisihEl = document.getElementById("rspfSelisihDisplay");
      if (!awalEl || !riilEl || !selisihEl) return;
      var awal = parseFloat(awalEl.getAttribute("data-raw")) || 0;
      var riil = parseFloat(riilEl.value) || 0;
      var diff = awal - riil;
      selisihEl.value = (diff >= 0 ? "Lebih: Rp " : "Kurang: Rp ") + Math.abs(diff).toLocaleString('id-ID');
    }

    function handleRSPFSubmit(e) {
      e.preventDefault();
      startLoading();

      var noRF = document.getElementById("rspfNoRFSelector").value;
      var nominalAwal = parseFloat(document.getElementById("rspfNominalAwal").getAttribute("data-raw")) || 0;
      var nominalRiil = parseFloat(document.getElementById("rspfNominalRiil").value) || 0;
      var selisih = nominalAwal - nominalRiil;

      var fileInp = document.getElementById("rspfFileInput");
      var file = (fileInp && fileInp.files && fileInp.files.length > 0) ? fileInp.files[0] : null;

      var payload = {
        noRF: noRF,
        emailRequester: currentUser.email,
        nilaiPencairan: nominalAwal,
        nilaiRealisasi: nominalRiil,
        selisihNilai: selisih,
        fileName: file ? file.name : null,
        fileMimeType: file ? file.type : null,
        fileData: null
      };

      var sendReport = function() {
        if (typeof google !== "undefined" && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(function(res) {
              endLoading();
              Swal.fire('Berhasil!', res, 'success');
              loadAllData();
              loadPage(currentUser.role === 'RPM' ? 'status_rf' : 'dashboard');
            })
            .withFailureHandler(function(err) {
              endLoading();
              Swal.fire('Gagal!', err.message, 'error');
            })
            .saveRSPFReport(payload);
        } else {
          endLoading();
          Swal.fire('Berhasil', 'Laporan RSPF berhasil dikirim.', 'success');
          loadPage(currentUser.role === 'RPM' ? 'status_rf' : 'dashboard');
        }
      };

      if (file) {
        var reader = new FileReader();
        reader.onload = function(evt) {
          payload.fileData = evt.target.result;
          sendReport();
        };
        reader.readAsDataURL(file);
      } else {
        sendReport();
      }
    }

    function parseUploadedExcel(fileInputId, callback) {
      var fileInput = document.getElementById(fileInputId);
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        Swal.fire('Perhatian', 'Pilih file terlebih dahulu.', 'warning');
        return;
      }
      startLoading();
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var data = new Uint8Array(e.target.result);
          var workbook = XLSX.read(data, { type: 'array' });
          var firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          var jsonData = XLSX.utils.sheet_to_json(firstSheet);
          callback(jsonData);
        } catch(err) {
          endLoading();
          Swal.fire('Error', 'Gagal memproses file.', 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

      startLoading();
      var targetVault = document.getElementById("rf2TargetVault").value;
      var nominal = parseFloat(document.getElementById("rf2Nilai").value) || 0;
      var payload = {
        role: "APC", email: currentUser.email, namaRequester: currentUser.nama, siteIds: ["PETTY-CASH"],
        totalNilai: nominal, kategoriBiaya: "KAS", costCategory: "Kas Advance / Petty Cash",
        costDetail: "Pengisian " + targetVault, targetVault: targetVault,
        sowDetails: [{ sow2: "TOP-UP", sow4: "Pengisian " + targetVault, itemCode: "KAS-01" }]
      };
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(res) { endLoading(); Swal.fire('Berhasil!', res, 'success'); loadAllData(); loadPage('status_rf'); }).saveRequestForm(payload);
      } else {
        endLoading();
        Swal.fire('Berhasil', 'Permohonan top-up kas dikirim.', 'success');
        loadPage('status_rf');
      }
    }

    function showToast(icon, title) {
      if (typeof Swal !== 'undefined' && Swal.mixin) {
        Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1800 }).fire({ icon: icon, title: title });
      }
    }

    function loadAllData() {
      if (typeof google !== "undefined" && google.script && google.script.run) {
        var envEl = document.getElementById("envBadgeText");
        if (envEl) envEl.innerText = "Multi-Vault Engine (Live Connected)";

        google.script.run
          .withSuccessHandler(function(res) {
            if (res) {
              if (res.saldo) db.saldo = res.saldo;
              if (Array.isArray(res.poList)) db.poList = res.poList;
              if (Array.isArray(res.sowList)) db.sowList = res.sowList;
              if (Array.isArray(res.costCatalog)) db.costCatalog = res.costCatalog;
              if (Array.isArray(res.costCategories)) db.costCategories = res.costCategories;
              if (Array.isArray(res.list)) db.list = res.list;
              if (Array.isArray(res.invoicesList)) db.invoicesList = res.invoicesList;
              if (Array.isArray(res.usersList)) db.usersList = res.usersList;
              if (Array.isArray(res.utangPiutangList)) db.utangPiutangList = res.utangPiutangList;

              updateUserBadge();
              renderNavMenu();
              loadPage(currentPage);
            }
          })
          .withFailureHandler(function(err) {
            console.warn("Gagal mengambil data live:", err);
          })
          .getAllData();
      }
    }

    // --- VIEW: KASBON KARYAWAN ---
    function renderKasbonPage(container) {
      if (!container) return;
      var canManage = ['FA', 'APC', 'AS'].includes(currentUser.role);
      var users = Array.isArray(db.usersList) && db.usersList.length > 0 ? db.usersList : [
        { userId: 'USR-01', nama: 'Budi Santoso', email: 'budi.rpm@kubikmadani.co.id' },
        { userId: 'USR-02', nama: 'Hendra Pratama', email: 'pm.telco@kubikmadani.co.id' },
        { userId: 'USR-03', nama: 'Agus Ops', email: 'agus@kubikmadani.co.id' }
      ];

      var userOpts = '<option value="">-- Pilih Nama Karyawan & User ID --</option>';
      for (var u = 0; u < users.length; u++) {
        userOpts += '<option value="' + users[u].userId + '" data-nama="' + users[u].nama + '" data-email="' + users[u].email + '">' + 
          users[u].nama + ' &bull; (' + users[u].userId + ')</option>';
      }

      var tenorOpts = '';
      for (var t = 1; t <= 12; t++) {
        tenorOpts += '<option value="' + t + '" ' + (t === 3 ? 'selected' : '') + '>' + t + ' Bulan (' + t + 'x Potong Gaji)</option>';
      }

      if (!db.kasbonList) db.kasbonList = [];
      var list = db.kasbonList;

      var rows = '';
      for (var i = 0; i < list.length; i++) {
        var ksb = list[i];
        var badgeSt = (ksb.status === 'Lunas') ? 'bg-success' : 'bg-warning text-dark';
        
        var installmentButtons = '<div class="d-flex flex-wrap gap-1 mt-1">';
        for (var c = 1; c <= ksb.tenorBulan; c++) {
          var isPaid = c <= (ksb.cicilanKeTerakhir || 0);
          if (isPaid) {
            installmentButtons += '<span class="badge bg-success bg-opacity-75 text-white" style="font-size: 9.5px;"><i class="bi bi-check-circle"></i> C' + c + ' Lunas</span>';
          } else if (canManage && (c === (ksb.cicilanKeTerakhir || 0) + 1)) {
            installmentButtons += '<button onclick="payInstallment(\'' + ksb.id + '\', ' + c + ')" class="btn btn-xs btn-outline-primary py-0 px-1.5 fw-bold" style="font-size: 10px;" title="Bayar Cicilan ke-' + c + '">Bayar C' + c + '</button>';
          } else {
            installmentButtons += '<span class="badge bg-light text-muted border" style="font-size: 9.5px;">C' + c + '</span>';
          }
        }
        installmentButtons += '</div>';

        rows += '<tr>' +
          '<td class="fw-bold text-primary">' + ksb.id + '</td>' +
          '<td>' + ksb.tanggal + '</td>' +
          '<td><b class="text-dark">' + ksb.namaKaryawan + '</b><br><small class="text-muted">' + ksb.userId + '</small></td>' +
          '<td class="text-end fw-bold">Rp ' + Number(ksb.jumlahPinjaman).toLocaleString('id-ID') + '</td>' +
          '<td class="text-center"><span class="badge bg-light text-dark border">' + ksb.tenorBulan + ' Bulan</span></td>' +
          '<td class="text-end text-muted">Rp ' + Number(ksb.cicilanPerBulan).toLocaleString('id-ID') + '/bln</td>' +
          '<td><span class="badge bg-primary bg-opacity-10 text-primary border">' + ksb.sumberKas + '</span></td>' +
          '<td class="text-end text-danger fw-bold">Rp ' + Number(ksb.sisaPinjaman).toLocaleString('id-ID') + '</td>' +
          '<td class="text-center"><span class="badge ' + badgeSt + '">' + ksb.status + '</span></td>' +
          '<td>' + installmentButtons + '</td>' +
          '</tr>';
      }

      var formCardHtml = canManage ? (
        '<form onsubmit="handleKasbonSubmit(event)" class="card bg-light p-3 border-0 rounded-3 shadow-sm mb-3">' +
          '<h6 class="fw-bold text-primary mb-2"><i class="bi bi-cash-stack me-1"></i> Form Pengajuan & Pencairan Kasbon Karyawan</h6>' +
          '<div class="row g-2 mb-2">' +
            '<div class="col-12 col-sm-6">' +
              '<label class="form-label small mb-1 fw-bold">Pilih Karyawan (Nama & ID) *</label>' +
              '<select id="ksbUserSelector" required onchange="onKasbonUserChanged(this)" class="form-select form-select-sm fw-bold">' + userOpts + '</select>' +
              '<input type="hidden" id="ksbNamaHidden"><input type="hidden" id="ksbEmailHidden">' +
            '</div>' +
            '<div class="col-6 col-sm-3">' +
              '<label class="form-label small mb-1 fw-bold">Jumlah Pinjaman (Rp) *</label>' +
              '<input type="number" id="ksbNominal" oninput="calcKasbonCicilan()" required min="50000" placeholder="Contoh: 1500000" class="form-control form-control-sm fw-bold text-primary">' +
            '</div>' +
            '<div class="col-6 col-sm-3">' +
              '<label class="form-label small mb-1 fw-bold">Jumlah Tenor Cicilan *</label>' +
              '<select id="ksbTenorSelector" onchange="calcKasbonCicilan()" class="form-select form-select-sm">' + tenorOpts + '</select>' +
            '</div>' +
          '</div>' +
          '<div class="row g-2 mb-2">' +
            '<div class="col-6 col-sm-4">' +
              '<label class="form-label small mb-1 fw-bold">Ditransfer Dari Kas *</label>' +
              '<select id="ksbVaultSelector" class="form-select form-select-sm fw-bold">' +
                '<option value="Kas Kecil A">Kas Kecil A</option>' +
                '<option value="Kas Kecil B">Kas Kecil B</option>' +
                '<option value="Kas Kecil C">Kas Kecil C</option>' +
                '<option value="Kas Kecil D">Kas Kecil D</option>' +
              '</select>' +
            '</div>' +
            '<div class="col-6 col-sm-4">' +
              '<label class="form-label small mb-1">Estimasi Potongan / Bulan</label>' +
              '<input type="text" id="ksbCicilanDisplay" readonly value="Rp 0 / bulan" class="form-control form-control-sm bg-white fw-bold text-success">' +
            '</div>' +
            '<div class="col-12 col-sm-4">' +
              '<label class="form-label small mb-1">Catatan / Keperluan</label>' +
              '<input type="text" id="ksbCatatan" placeholder="Contoh: Kasbon darurat keluarga" class="form-control form-control-sm">' +
            '</div>' +
          '</div>' +
          '<button type="submit" class="btn btn-sm btn-primary fw-bold py-1.5"><i class="bi bi-send-check me-1"></i> Cairkan Kasbon Karyawan</button>' +
        '</form>'
      ) : '<div class="alert alert-info py-2 px-3 small"><i class="bi bi-shield-lock me-1"></i> Mode Monitoring Kasbon Karyawan (View Only).</div>';

      container.innerHTML = '<div class="d-flex flex-column gap-2">' +
        formCardHtml +
        '<div class="card border-0 shadow-sm rounded-3">' +
          '<div class="card-header bg-light d-flex justify-content-between align-items-center py-2">' +
            '<span class="fw-bold small text-dark"><i class="bi bi-journal-bookmark me-1"></i> RIWAYAT KASBON & TRACKING CICILAN GAJI</span>' +
          '</div>' +
          '<div class="table-responsive custom-scrollbar" style="max-height: 400px;">' +
            '<table class="table table-sm table-hover text-nowrap align-middle mb-0" style="font-size: 11px;">' +
              '<thead class="table-light sticky-top">' +
                '<tr>' +
                  '<th>ID Kasbon</th><th>Tanggal</th><th>Karyawan (ID)</th><th class="text-end">Pinjaman</th><th class="text-center">Tenor</th><th class="text-end">Cicilan/Bln</th><th>Kas Sumber</th><th class="text-end">Sisa Hutang</th><th class="text-center">Status</th><th>Tracking Cicilan Gaji (1 s/d 12)</th>' +
                '</tr>' +
              '</thead>' +
              '<tbody>' + (rows || '<tr><td colspan="10" class="text-center py-4 text-muted">Belum ada riwayat kasbon.</td></tr>') + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function onKasbonUserChanged(sel) {
      var opt = sel.options[sel.selectedIndex];
      if (opt) {
        document.getElementById("ksbNamaHidden").value = opt.getAttribute("data-nama") || "";
        document.getElementById("ksbEmailHidden").value = opt.getAttribute("data-email") || "";
      }
    }

    function calcKasbonCicilan() {
      var pinjaman = parseFloat(document.getElementById("ksbNominal").value) || 0;
      var tenor = parseInt(document.getElementById("ksbTenorSelector").value, 10) || 1;
      var perBulan = Math.round(pinjaman / tenor);
      var displayEl = document.getElementById("ksbCicilanDisplay");
      if (displayEl) {
        displayEl.value = "Rp " + perBulan.toLocaleString('id-ID') + " / bulan";
      }
    }

    function handleKasbonSubmit(e) {
      e.preventDefault();
      startLoading();

      var sel = document.getElementById("ksbUserSelector");
      var opt = sel.options[sel.selectedIndex];
      var pinjaman = parseFloat(document.getElementById("ksbNominal").value) || 0;
      var tenor = parseInt(document.getElementById("ksbTenorSelector").value, 10) || 1;

      var payload = {
        userId: sel.value,
        namaKaryawan: opt ? opt.getAttribute("data-nama") : "Karyawan",
        email: opt ? opt.getAttribute("data-email") : "-",
        jumlahPinjaman: pinjaman,
        tenorBulan: tenor,
        sumberKas: document.getElementById("ksbVaultSelector").value,
        catatan: document.getElementById("ksbCatatan").value.trim()
      };

      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            endLoading();
            Swal.fire('Berhasil!', res, 'success');
            loadAllData();
            loadPage('kasbon_karyawan');
          })
          .withFailureHandler(function(err) {
            endLoading();
            Swal.fire('Gagal!', err.message, 'error');
          })
          .saveKasbonEntry(payload);
      } else {
        endLoading();
        var perBulan = Math.round(pinjaman / tenor);
        db.kasbonList.unshift({
          id: "KSB-2609-0" + (db.kasbonList.length + 1),
          tanggal: "02/09/2026",
          userId: payload.userId,
          namaKaryawan: payload.namaKaryawan,
          jumlahPinjaman: pinjaman,
          tenorBulan: tenor,
          cicilanPerBulan: perBulan,
          sumberKas: payload.sumberKas,
          sisaPinjaman: pinjaman,
          cicilanKeTerakhir: 0,
          status: "Belum Lunas"
        });
        Swal.fire('Berhasil', 'Kasbon berhasil dicatat dan dicairkan.', 'success');
        loadPage('kasbon_karyawan');
      }
    }

    function payInstallment(idKasbon, cicilanKe) {
      Swal.fire({
        title: 'Konfirmasi Bayar Cicilan ke-' + cicilanKe + '?',
        text: 'Mencatat pemotongan cicilan gaji untuk kasbon ' + idKasbon,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Ya, Catat Bayar'
      }).then(function(res) {
        if (res.isConfirmed) {
          startLoading();
          if (typeof google !== "undefined" && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler(function(msg) {
                endLoading();
                Swal.fire('Selesai', msg, 'success');
                loadAllData();
                loadPage('kasbon_karyawan');
              })
              .withFailureHandler(function(err) {
                endLoading();
                Swal.fire('Gagal', err.message, 'error');
              })
              .payKasbonInstallment(idKasbon, cicilanKe);
          } else {
            endLoading();
            var item = null;
            for (var i = 0; i < db.kasbonList.length; i++) {
              if (db.kasbonList[i].id === idKasbon) { item = db.kasbonList[i]; break; }
            }
            if (item) {
              item.cicilanKeTerakhir = cicilanKe;
              item.sisaPinjaman = Math.max(0, item.sisaPinjaman - item.cicilanPerBulan);
              if (item.sisaPinjaman <= 0 || cicilanKe >= item.tenorBulan) item.status = "Lunas";
              else item.status = "Sebagian";
            }
            Swal.fire('Selesai', 'Cicilan ke-' + cicilanKe + ' berhasil dibayarkan.', 'success');
            loadPage('kasbon_karyawan');
          }
        }
      });
    }
    function togglePasswordVisibility() {
  var passInput = document.getElementById("loginPasswordInput");
  var icon = document.getElementById("togglePasswordIcon");
  if (passInput.type === "password") {
    passInput.type = "text";
    icon.className = "bi bi-eye-slash";
  } else {
    passInput.type = "password";
    icon.className = "bi bi-eye";
  }
}
  </script>
</body>
</html>
